name: Release

# Pushing a tag that starts with `v` (e.g. v0.1.0) builds the app and creates a Release.
on:
  push:
    tags:
      - "v*"

# Needed for tauri-action to create/update the Release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: a single universal binary (.dmg) for Intel and Apple Silicon.
          - platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
          # Windows: x64 .msi / NSIS installer.
          - platform: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No OS code signing/notarization (free distribution). Tauri ad-hoc signs automatically on macOS.
          # Signs the updater artifacts so installed apps can verify in-app updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.tauri-args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Claude Code Park ${{ github.ref_name }}"
          releaseBody: |
            ## Install (macOS)

            1. Download the `.dmg` from the Assets below, open it, and drag Claude Code Park into Applications.
            2. The app is unsigned, so on first launch macOS Gatekeeper will warn you. Open it one of these ways:
               - **macOS 14 or earlier**: right-click the app → "Open".
               - **macOS 15 (Sequoia) or later**: System Settings → "Privacy & Security" → "Open Anyway".
               - Or from a terminal:
                 ```
                 xattr -dr com.apple.quarantine "/Applications/Claude Code Park.app"
                 ```

            ## Install (Windows)

            1. Download the `.msi` (or the NSIS `-setup.exe`) from the Assets below and run it.
            2. The app is unsigned, so SmartScreen may warn you: click "More info" → "Run anyway".

            ⚠️ This app reads and visualizes `~/.claude/`, so it assumes Claude Code is installed.
          # The in-app updater reads /releases/latest/download/latest.json, and GitHub
          # excludes drafts from "latest" — updates reach users only after the draft is
          # manually published on GitHub. Publishing the draft IS the release switch.
          releaseDraft: true
          prerelease: false
